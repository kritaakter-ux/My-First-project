<!DOCTYPE html>
<html>
<head>
    <title>My College Website</title>

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background-image: url("college.jpg.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .overlay {
            background-color: rgba(0,0,0,0.5);
            min-height: 100vh;
            color: white;
        }

        /* Menu */
        .menu {
            text-align: center;
            padding: 20px;
            background-color: rgba(0,0,0,0.7);
        }

        .menu a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-size: 18px;
        }

        .menu a:hover {
            color: yellow;
        }

        /* Title */
        .title {
            text-align: center;
            margin-top: 20px;
        }

        .title h1 {
            font-size: 40px;
        }

        /* Main layout */
        .main {
            display: flex;
            justify-content: space-between;
            padding: 30px;
            gap: 30px;
        }

        /* Dashboard */
        .dashboard {
            background-color: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            width: 250px;
        }

        .dashboard p {
            margin: 8px 0;
            font-size: 14px;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex: 1;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Leadership */
        .section {
            text-align: center;
            margin-top: 40px;
        }

        .leaders {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .leader-box {
            background-color: white;
            color: black;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
        }

        .leader-box img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            background-color: rgba(0,0,0,0.7);
            margin-top: 30px;
        }

        /* 🔥 MOBILE RESPONSIVE */
        @media (max-width: 768px) {

            .menu {
                display: flex;
                flex-direction: column;
            }

            .menu a {
                margin: 10px 0;
                font-size: 16px;
            }

            .title h1 {
                font-size: 25px;
            }

            .main {
                flex-direction: column;
                align-items: center;
            }

            .dashboard {
                width: 90%;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 180px;
            }

            .leaders {
                flex-direction: column;
                align-items: center;
            }

            .leader-box {
                width: 90%;
            }
        }

    </style>
</head>

<body>

<div class="overlay">

    <!-- Menu -->
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

    <!-- Title -->
    <div class="title">
        <h1>Kazi Mohammad Shafiqul Islam College</h1>
    </div>

    <!-- Main -->
    <div class="main">

        <!-- Dashboard -->
        <div class="dashboard">
            <h2>Dashboard</h2>
            <p>📢 Admission Open 2026</p>
            <p>📚 Science | Arts | Commerce</p>
            <p>🎓 Honors Available</p>
            <p>🏫 Modern Campus</p>
        </div>

        <!-- Gallery -->
        <div class="gallery">
            <img src="slide1.jpg.png">
            <img src="slide2.jpg.png">
            <img src="slide3.jpg.png">
            <img src="slide4.jpg.png">
            <img src="slide5.jpg.png">
            <img src="slide6.jpg.png">
            <img src="college.jpg.png">
        </div>

    </div>

    <!-- Leadership -->
    <div class="section">

        <h2>Our Leadership</h2>

        <div class="leaders">

            <div class="leader-box">
                <img src="founder.jpg.png">
                <h3>Founder</h3>
                <p>Kazi Shafiul Islam</p>
            </div>

            <div class="leader-box">
                <img src="principal.jpg.png">
                <h3>Principal</h3>
                <p>Shafiqur Rahman</p>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 Kazi Mohammad Shafiqul Islam College</p>
    </div>

</div>

</body>
</html>
